<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live Options Chain - NIFTY & BANKNIFTY</title>
  <style>
    :root {
      --bg: #f6f8fa;
      --panel: #ffffff;
      --muted: #5b6b7b;
      --text: #0f172a;
      --green: #22863a;
      --red: #cb2431;
      --yellow: #b08800;
      --border: #e5e7eb;
      --accent: #2563eb;
      --thead: #f1f5f9;
      --thead2: #e2e8f0;
      --row-alt: #fafbfc;
      --maxoi: #fff7ed;
      --atm: #e0ecff;
    }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }
    .container { max-width: 1200px; margin: 0 auto; padding: 16px; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .row + .row { margin-top: 12px; }
    label { color: var(--muted); font-size: 13px; }
    select, input[type="number"] {
      background: #fff; color: var(--text); border: 1px solid var(--border);
      padding: 8px 10px; border-radius: 8px; outline: none;
    }
    button {
      background: var(--accent); border: none; color: white; padding: 10px 14px; border-radius: 10px; cursor: pointer;
    }
    button.secondary { background: #64748b; }
    .muted { color: var(--muted); }
    .stats { display: flex; gap: 16px; flex-wrap: wrap; }
    .stat { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; }
    .table-wrap { overflow: auto; border: 1px solid var(--border); border-radius: 12px; margin-top: 12px; }
    table { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 980px; }
    thead tr.group th { position: sticky; top: 0; background: var(--thead); border-bottom: 1px solid var(--border); padding: 8px; text-align: center; font-weight: 700; color: #475569; }
    thead tr.cols th { position: sticky; top: 34px; background: var(--thead2); border-bottom: 1px solid var(--border); padding: 8px; text-align: right; font-weight: 600; color: #64748b; }
    thead tr.cols th.first { text-align: right; }
    thead tr.cols th.strike { text-align: center; }
    tbody td { padding: 8px; border-bottom: 1px solid var(--border); text-align: right; }
    tbody td.strike { text-align: center; font-weight: 600; color: #334155; }
    tbody tr.atm { background: var(--atm); }
    tbody td.maxoi { background: var(--maxoi); font-weight: 700; }
    .pos { color: var(--green); font-weight: 600; }
    .neg { color: var(--red); font-weight: 600; }
    .footer { margin-top: 10px; font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="container">
    <h2 style="margin:8px 0 14px 0;">Live Options Chain <span class="muted">(NSE_FNO / OPTIDX)</span></h2>

    <div class="card">
      <div class="row">
        <div>
          <label>Index</label><br/>
          <select id="index">
            <option value="NIFTY">NIFTY</option>
            <option value="BANKNIFTY">BANKNIFTY</option>
          </select>
        </div>
        <div>
          <label>Strikes each side</label><br/>
          <input id="strikes" type="number" min="3" max="20" value="10" />
        </div>
        <div style="margin-top:18px; display:flex; gap:8px;">
          <button id="startBtn">Start</button>
          <button class="secondary" id="stopBtn">Stop</button>
        </div>
      </div>

      <div class="row">
        <div class="stats">
          <div class="stat">Index: <b id="statIndex">-</b></div>
          <div class="stat">Spot: <b id="statSpot">-</b></div>
          <div class="stat">Expiry: <b id="statExpiry">-</b></div>
          <div class="stat">Updated: <b id="statUpdated">-</b></div>
        </div>
      </div>

      <div class="table-wrap">
        <table id="chainTable">
          <thead>
            <tr class="group">
              <th colspan="5">CALLS</th>
              <th class="strike">STRIKE</th>
              <th colspan="5">PUTS</th>
            </tr>
            <tr class="cols">
              <th class="first">OI</th>
              <th>Chg OI</th>
              <th>Vol</th>
              <th>LTP</th>
              <th>Chg</th>
              <th class="strike">Strike</th>
              <th>Chg</th>
              <th>LTP</th>
              <th>Vol</th>
              <th>Chg OI</th>
              <th>OI</th>
            </tr>
          </thead>
          <tbody id="chainBody"></tbody>
        </table>
      </div>
      <div class="footer">Note: Change% is based on previous close from feed when available. Best viewed during market hours (09:15–15:30 IST).</div>
    </div>
  </div>

  <script>
    const chainBody = document.getElementById('chainBody');
    const statIndex = document.getElementById('statIndex');
    const statSpot = document.getElementById('statSpot');
    const statExpiry = document.getElementById('statExpiry');
    const statUpdated = document.getElementById('statUpdated');

    const indexSel = document.getElementById('index');
    const strikesInp = document.getElementById('strikes');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');

    let ws = null;
    let currentIdx = 'NIFTY';
    let stepMap = { NIFTY: 50, BANKNIFTY: 100 };

    function formatNum(n) {
      if (n === null || n === undefined) return '-';
      return n.toLocaleString('en-IN');
    }

    function classForChange(val) {
      if (val > 0.0001) return 'pos';
      if (val < -0.0001) return 'neg';
      return '';
    }
    
    function formatSigned(n) {
      const s = Math.abs(n).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      if (n > 0) return '+' + s;
      if (n < 0) return '-' + s;
      return '0.00';
    }

    function renderOptionsChain(snapshot) {
      if (!snapshot || !snapshot.rows || snapshot.rows.length === 0) {
        chainBody.innerHTML = '<tr><td colspan="11" style="text-align: center;">No data available</td></tr>';
        return;
      }
      
      // Update stats
      statIndex.textContent = snapshot.index || currentIdx;
      statSpot.textContent = snapshot.spot ? snapshot.spot.toFixed(2) : '-';
      statExpiry.textContent = snapshot.expiry || '-';
      statUpdated.textContent = new Date(snapshot.ts).toLocaleTimeString();
      
      const step = stepMap[snapshot.index] || 50;
      const atmStrike = snapshot.spot ? Math.round(snapshot.spot / step) * step : null;
      
      // Find max OI for highlighting
      let maxCeOi = 0, maxPeOi = 0;
      snapshot.rows.forEach(r => {
        if (r.ce.oi > maxCeOi) maxCeOi = r.ce.oi;
        if (r.pe.oi > maxPeOi) maxPeOi = r.pe.oi;
      });
      
      chainBody.innerHTML = '';
      
      snapshot.rows.forEach(row => {
        const strike = row.strike;
        const ce = row.ce;
        const pe = row.pe;
        
        const tr = document.createElement('tr');
        if (atmStrike !== null && strike === atmStrike) tr.classList.add('atm');
        
        const ceChgCls = classForChange(ce.chg);
        const peChgCls = classForChange(pe.chg);
        
        const ceOiCls = (maxCeOi > 0 && ce.oi === maxCeOi) ? 'maxoi' : '';
        const peOiCls = (maxPeOi > 0 && pe.oi === maxPeOi) ? 'maxoi' : '';
        
        tr.innerHTML = `
          <td class="${ceOiCls}">${formatNum(ce.oi)}</td>
          <td class="${classForChange(ce.oi_chg)}">${formatSigned(ce.oi_chg)}</td>
          <td>${formatNum(ce.vol)}</td>
          <td>${ce.ltp.toFixed(2)}</td>
          <td class="${ceChgCls}">${formatSigned(ce.chg)} (${ce.chg_pct.toFixed(2)}%)</td>
          <td class="strike">${strike.toLocaleString()}</td>
          <td class="${peChgCls}">${formatSigned(pe.chg)} (${pe.chg_pct.toFixed(2)}%)</td>
          <td>${pe.ltp.toFixed(2)}</td>
          <td>${formatNum(pe.vol)}</td>
          <td class="${classForChange(pe.oi_chg)}">${formatSigned(pe.oi_chg)}</td>
          <td class="${peOiCls}">${formatNum(pe.oi)}</td>
        `;
        chainBody.appendChild(tr);
      });
    }

    function connectWebSocket() {
      const idx = (indexSel.value || 'NIFTY').toUpperCase();
      const strikes = parseInt(strikesInp.value) || 10;
      currentIdx = idx;
      
      // Close existing connection
      if (ws) {
        ws.close();
        ws = null;
      }
      
      // Show connecting status
      chainBody.innerHTML = '<tr><td colspan="11" style="text-align: center; padding: 20px;">🔄 Connecting to WebSocket...</td></tr>';
      
      // Create WebSocket connection
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}/api/v2/ws/options-chain`;
      
      console.log('Connecting to:', wsUrl);
      ws = new WebSocket(wsUrl);
      
      ws.onopen = () => {
        console.log('✅ WebSocket connected');
        // Send initial config
        ws.send(JSON.stringify({
          action: 'start',
          index: idx,
          strikesEachSide: strikes
        }));
        chainBody.innerHTML = '<tr><td colspan="11" style="text-align: center; padding: 20px;">⏳ Loading option chain data...</td></tr>';
      };
      
      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          console.log('Received:', data.type);
          
          if (data.type === 'connection') {
            console.log('✅ Connection established:', data.message);
          } else if (data.type === 'snapshot') {
            renderOptionsChain(data);
          } else if (data.type === 'error') {
            console.error('❌ Error:', data.message);
            chainBody.innerHTML = `<tr><td colspan="11" style="text-align: center; color: #b08800; padding: 20px;">
              ⚠️ ${data.message}<br/><br/>
              <small style="color: #64748b;">This usually happens when:<br/>
              • Market is closed (trading hours: 9:15 AM - 3:30 PM IST)<br/>
              • DHAN API credentials are incorrect<br/>
              • Network connectivity issues</small>
            </td></tr>`;
          } else if (data.type === 'ping') {
            // Respond to ping
            ws.send(JSON.stringify({ action: 'ping' }));
          }
        } catch (error) {
          console.error('Error parsing message:', error);
        }
      };
      
      ws.onerror = (error) => {
        console.error('❌ WebSocket error:', error);
        chainBody.innerHTML = '<tr><td colspan="11" style="text-align: center; color: red; padding: 20px;">WebSocket error. Check console and ensure backend is running.</td></tr>';
      };
      
      ws.onclose = () => {
        console.log('📴 WebSocket closed');
        if (startBtn.disabled) {
          chainBody.innerHTML = '<tr><td colspan="11" style="text-align: center; color: #b08800; padding: 20px;">Connection closed. Click Start to reconnect.</td></tr>';
        }
        startBtn.disabled = false;
        stopBtn.disabled = true;
      };
      
      startBtn.disabled = true;
      stopBtn.disabled = false;
    }

    function disconnectWebSocket() {
      if (ws) {
        ws.send(JSON.stringify({ action: 'stop' }));
        ws.close();
        ws = null;
      }
      startBtn.disabled = false;
      stopBtn.disabled = true;
      chainBody.innerHTML = '<tr><td colspan="11" style="text-align: center;">Stopped. Click Start to begin.</td></tr>';
    }

    startBtn.addEventListener('click', connectWebSocket);
    stopBtn.addEventListener('click', disconnectWebSocket);

    // Auto-start on load
    window.addEventListener('load', () => {
      connectWebSocket();
    });
  </script>
</body>
</html>
