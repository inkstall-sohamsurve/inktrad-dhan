<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live Options Chain - NIFTY & BANKNIFTY</title>
  <style>
    :root {
      --bg: #f6f8fa;
      --panel: #ffffff;
      --muted: #5b6b7b;
      --text: #0f172a;
      --green: #22863a;
      --red: #cb2431;
      --yellow: #b08800;
      --border: #e5e7eb;
      --accent: #2563eb;
      --thead: #f1f5f9;
      --thead2: #e2e8f0;
      --row-alt: #fafbfc;
      --maxoi: #fff7ed;
      --atm: #e0ecff;
    }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }
    .container { max-width: 1200px; margin: 0 auto; padding: 16px; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .row + .row { margin-top: 12px; }
    label { color: var(--muted); font-size: 13px; }
    select, input[type="number"] {
      background: #fff; color: var(--text); border: 1px solid var(--border);
      padding: 8px 10px; border-radius: 8px; outline: none;
    }
    button {
      background: var(--accent); border: none; color: white; padding: 10px 14px; border-radius: 10px; cursor: pointer;
    }
    button.secondary { background: #64748b; }
    .muted { color: var(--muted); }
    .stats { display: flex; gap: 16px; flex-wrap: wrap; }
    .stat { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; }
    .table-wrap { overflow: auto; border: 1px solid var(--border); border-radius: 12px; margin-top: 12px; }
    table { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 980px; }
    thead tr.group th { position: sticky; top: 0; background: var(--thead); border-bottom: 1px solid var(--border); padding: 8px; text-align: center; font-weight: 700; color: #475569; }
    thead tr.cols th { position: sticky; top: 34px; background: var(--thead2); border-bottom: 1px solid var(--border); padding: 8px; text-align: right; font-weight: 600; color: #64748b; }
    thead tr.cols th.first { text-align: right; }
    thead tr.cols th.strike { text-align: center; }
    tbody td { padding: 8px; border-bottom: 1px solid var(--border); text-align: right; }
    tbody td.strike { text-align: center; font-weight: 600; color: #334155; }
    tbody tr.atm { background: var(--atm); }
    tbody td.maxoi { background: var(--maxoi); font-weight: 700; }
    .pos { color: var(--green); font-weight: 600; }
    .neg { color: var(--red); font-weight: 600; }
    .footer { margin-top: 10px; font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="container">
    <h2 style="margin:8px 0 14px 0;">Live Options Chain <span class="muted">(NSE_FNO / OPTIDX)</span></h2>

    <div class="card">
      <div class="row">
        <div>
          <label>Index</label><br/>
          <select id="index">
            <option value="NIFTY">NIFTY</option>
            <option value="BANKNIFTY">BANKNIFTY</option>
          </select>
        </div>
        <div>
          <label>Strikes each side</label><br/>
          <input id="strikes" type="number" min="3" max="20" value="10" />
        </div>
        <div style="margin-top:18px; display:flex; gap:8px;">
          <button id="startBtn">Start</button>
          <button class="secondary" id="stopBtn">Stop</button>
        </div>
      </div>

      <div class="row">
        <div class="stats">
          <div class="stat">Index: <b id="statIndex">-</b></div>
          <div class="stat">Spot: <b id="statSpot">-</b></div>
          <div class="stat">Expiry: <b id="statExpiry">-</b></div>
          <div class="stat">Updated: <b id="statUpdated">-</b></div>
        </div>
      </div>

      <div class="table-wrap">
        <table id="chainTable">
          <thead>
            <tr class="group">
              <th colspan="5">CALLS</th>
              <th class="strike">STRIKE</th>
              <th colspan="5">PUTS</th>
            </tr>
            <tr class="cols">
              <th class="first">OI</th>
              <th>Chg OI</th>
              <th>Vol</th>
              <th>LTP</th>
              <th>Chg</th>
              <th class="strike">Strike</th>
              <th>Chg</th>
              <th>LTP</th>
              <th>Vol</th>
              <th>Chg OI</th>
              <th>OI</th>
            </tr>
          </thead>
          <tbody id="chainBody"></tbody>
        </table>
      </div>
      <div class="footer">Note: Change% is based on previous close from feed when available. Best viewed during market hours (09:15–15:30 IST).</div>
    </div>
  </div>

  <script>
    const chainBody = document.getElementById('chainBody');
    const statIndex = document.getElementById('statIndex');
    const statSpot = document.getElementById('statSpot');
    const statExpiry = document.getElementById('statExpiry');
    const statUpdated = document.getElementById('statUpdated');

    const indexSel = document.getElementById('index');
    const strikesInp = document.getElementById('strikes');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');

    let intervalId = null;
    let currentIdx = 'NIFTY';
    let stepMap = { NIFTY: 50, BANKNIFTY: 100 };

    function formatNum(n) {
      if (n === null || n === undefined) return '-';
      return n.toLocaleString('en-IN');
    }

    function classForChange(val) {
      if (val > 0.0001) return 'pos';
      if (val < -0.0001) return 'neg';
      return '';
    }
    function formatSigned(n) {
      const s = Math.abs(n).toLocaleString('en-IN');
      if (n > 0) return '+' + s;
      if (n < 0) return '-' + s;
      return '0';
    }

    async function fetchOptionsChain() {
      try {
        const response = await fetch(`/api/v2/options-chain/live?index=${currentIdx}`);
        const result = await response.json();
        
        if (result.status === 'success' && result.data) {
          renderOptionsChain(result.data);
          statUpdated.textContent = new Date(result.timestamp).toLocaleTimeString();
        } else if (result.status === 'error') {
          // Show user-friendly error message
          const errorMsg = result.message || 'Failed to load data';
          console.warn('API returned error:', errorMsg);
          chainBody.innerHTML = `<tr><td colspan="11" style="text-align: center; color: #b08800; padding: 20px;">
            ⚠️ ${errorMsg}<br/><br/>
            <small style="color: #64748b;">This usually happens when:<br/>
            • Market is closed (trading hours: 9:15 AM - 3:30 PM IST)<br/>
            • Invalid expiry date<br/>
            • DHAN API credentials are incorrect</small>
          </td></tr>`;
          statUpdated.textContent = new Date(result.timestamp).toLocaleTimeString();
        } else {
          console.error('Unexpected API response:', result);
          chainBody.innerHTML = '<tr><td colspan="11" style="text-align: center; color: red;">Unexpected response format. Check console.</td></tr>';
        }
      } catch (error) {
        console.error('Fetch error:', error);
        chainBody.innerHTML = '<tr><td colspan="11" style="text-align: center; color: red;">Network error. Check connection and ensure backend is running.</td></tr>';
      }
    }

    function renderOptionsChain(data) {
      // The API returns data in the format from live_options_chain.py
      // We need to extract strikes and create rows similar to the WebSocket format
      
      statIndex.textContent = currentIdx;
      statSpot.textContent = '-'; // Spot price not directly available in this format
      statExpiry.textContent = 'Auto'; // Expiry not directly available
      
      // Parse the data structure
      if (!data || typeof data !== 'object') {
        chainBody.innerHTML = '<tr><td colspan="11" style="text-align: center;">No data available</td></tr>';
        return;
      }
      
      // Extract strikes from the data
      const strikes = Object.keys(data).filter(key => key !== 'status').sort((a, b) => parseFloat(a) - parseFloat(b));
      
      if (strikes.length === 0) {
        chainBody.innerHTML = '<tr><td colspan="11" style="text-align: center;">No strike data available</td></tr>';
        return;
      }
      
      const step = stepMap[currentIdx] || 50;
      const atmStrike = null; // We don't have spot price to calculate ATM
      
      chainBody.innerHTML = '';
      
      strikes.forEach(strikeKey => {
        const strikeData = data[strikeKey];
        if (!strikeData || !strikeData.ce || !strikeData.pe) return;
        
        const strike = parseFloat(strikeKey);
        const ce = strikeData.ce;
        const pe = strikeData.pe;
        
        const tr = document.createElement('tr');
        if (atmStrike !== null && strike === atmStrike) tr.classList.add('atm');
        
        const ceChgCls = classForChange(ce.last_price || 0);
        const peChgCls = classForChange(pe.last_price || 0);
        
        tr.innerHTML = `
          <td>${formatNum(ce.oi || 0)}</td>
          <td class="muted">-</td>
          <td>${formatNum(ce.volume || 0)}</td>
          <td>${(ce.last_price || 0).toFixed(2)}</td>
          <td class="${ceChgCls}">0.00</td>
          <td class="strike">${strike.toLocaleString()}</td>
          <td class="${peChgCls}">0.00</td>
          <td>${(pe.last_price || 0).toFixed(2)}</td>
          <td>${formatNum(pe.volume || 0)}</td>
          <td class="muted">-</td>
          <td>${formatNum(pe.oi || 0)}</td>
        `;
        chainBody.appendChild(tr);
      });
    }

    function startFetching() {
      const idx = (indexSel.value || 'NIFTY').toUpperCase();
      currentIdx = idx;
      
      stopFetching(); // Stop any existing fetching
      
      // Start fetching immediately
      fetchOptionsChain();
      
      // Set up interval to fetch every 5 seconds
      intervalId = setInterval(fetchOptionsChain, 5000);
      
      startBtn.disabled = true;
      stopBtn.disabled = false;
    }

    function stopFetching() {
      if (intervalId) {
        clearInterval(intervalId);
        intervalId = null;
      }
      startBtn.disabled = false;
      stopBtn.disabled = true;
    }

    startBtn.addEventListener('click', startFetching);
    stopBtn.addEventListener('click', stopFetching);

    // Auto-start on load
    window.addEventListener('load', () => {
      startFetching();
    });
  </script>
</body>
</html>
