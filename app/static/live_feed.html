<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIFTY 50 Live Market Feed - Real-time Updates</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            text-align: center;
        }

        .header h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 600;
            margin-top: 15px;
        }

        .status.connected {
            background: #10b981;
            color: white;
        }

        .status.disconnected {
            background: #ef4444;
            color: white;
        }

        .status.connecting {
            background: #f59e0b;
            color: white;
        }

        .pulse {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: white;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 0.9em;
        }

        .table-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .table-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .search-box {
            padding: 10px 15px;
            border: none;
            border-radius: 25px;
            width: 300px;
            font-size: 14px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #f8f9fa;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #e5e7eb;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #f3f4f6;
            transition: all 0.3s ease;
        }

        tr:hover {
            background: #f9fafb;
        }

        .stock-name {
            font-weight: 600;
            color: #333;
        }

        .stock-symbol {
            color: #666;
            font-size: 0.85em;
        }

        .price {
            font-size: 1.1em;
            font-weight: 600;
        }

        .positive {
            color: #10b981;
        }

        .negative {
            color: #ef4444;
        }

        .neutral {
            color: #6b7280;
        }

        .change-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .change-badge.positive {
            background: #d1fae5;
            color: #065f46;
        }

        .change-badge.negative {
            background: #fee2e2;
            color: #991b1b;
        }

        .flash {
            animation: flash 0.5s ease;
        }

        @keyframes flash {
            0%, 100% { background: transparent; }
            50% { background: #fef3c7; }
        }

        .volume {
            font-size: 0.9em;
            color: #666;
        }

        .last-update {
            font-size: 0.8em;
            color: #999;
            font-style: italic;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #666;
        }

        .spinner {
            border: 4px solid #f3f4f6;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: #fee2e2;
            color: #991b1b;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 NIFTY 50 Live Market Feed</h1>
            <p>Real-time market data with WebSocket</p>
            <div id="connectionStatus" class="status connecting">
                <div class="pulse"></div>
                <span>Connecting...</span>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="totalStocks">0</div>
                <div class="stat-label">Total Stocks</div>
            </div>
            <div class="stat-card">
                <div class="stat-value positive" id="gainers">0</div>
                <div class="stat-label">Gainers</div>
            </div>
            <div class="stat-card">
                <div class="stat-value negative" id="losers">0</div>
                <div class="stat-label">Losers</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="updates">0</div>
                <div class="stat-label">Live Updates</div>
            </div>
        </div>

        <div class="table-container">
            <div class="table-header">
                <h2>Live Stock Prices</h2>
                <input type="text" id="searchBox" class="search-box" placeholder="Search stocks...">
            </div>

            <div id="loadingContainer" class="loading">
                <div class="spinner"></div>
                <p>Connecting to live market feed...</p>
            </div>

            <div id="errorContainer" style="display: none;"></div>

            <table id="stockTable" style="display: none;">
                <thead>
                    <tr>
                        <th>Stock</th>
                        <th>LTP</th>
                        <th>Change</th>
                        <th>Change %</th>
                        <th>Open</th>
                        <th>High</th>
                        <th>Low</th>
                        <th>Volume</th>
                        <th>Last Update</th>
                    </tr>
                </thead>
                <tbody id="stockTableBody">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let stockData = [];
        let updateCount = 0;
        let searchTerm = '';
        let autoRefreshInterval = null;
        let isLoading = false;

        // Fetch live data from REST API
        async function fetchLiveData() {
            if (isLoading) return;
            
            isLoading = true;
            const loadingContainer = document.getElementById('loadingContainer');
            const errorContainer = document.getElementById('errorContainer');
            const stockTable = document.getElementById('stockTable');
            
            try {
                updateStatus('connecting', 'Fetching live data...');
                
                const response = await fetch('/api/v2/live-feed/fetch-live-quotes', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();

                if (data.status === 'success') {
                    stockData = data.data;
                    updateCount++;
                    document.getElementById('updates').textContent = updateCount;
                    
                    loadingContainer.style.display = 'none';
                    errorContainer.style.display = 'none';
                    stockTable.style.display = 'table';
                    
                    renderStocks();
                    updateStats();
                    updateStatus('connected', 'Live Data Updated');
                } else {
                    showError(data.message || 'Failed to fetch live data');
                    updateStatus('disconnected', 'Error - Check credentials');
                }
            } catch (error) {
                console.error('Error fetching data:', error);
                showError(`Error: ${error.message}`);
                updateStatus('disconnected', 'Connection Error');
            } finally {
                isLoading = false;
            }
        }

        function startAutoRefresh() {
            if (autoRefreshInterval) return;
            
            // Fetch immediately
            fetchLiveData();
            
            // Then refresh every 5 seconds
            autoRefreshInterval = setInterval(fetchLiveData, 5000);
            console.log('✅ Auto-refresh started (5s interval)');
        }

        function stopAutoRefresh() {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
                autoRefreshInterval = null;
                console.log('⏸️ Auto-refresh stopped');
            }
        }

        function renderStocks() {
            const tbody = document.getElementById('stockTableBody');
            
            // Filter by search term
            let filteredStocks = stockData;
            if (searchTerm) {
                const term = searchTerm.toLowerCase();
                filteredStocks = stockData.filter(stock => 
                    stock.name.toLowerCase().includes(term) || 
                    stock.symbol.toLowerCase().includes(term)
                );
            }

            // Sort by name
            filteredStocks.sort((a, b) => a.name.localeCompare(b.name));

            tbody.innerHTML = filteredStocks.map(stock => {
                const changeClass = stock.change > 0 ? 'positive' : stock.change < 0 ? 'negative' : 'neutral';
                const arrow = stock.change > 0 ? '▲' : stock.change < 0 ? '▼' : '●';
                
                return `
                    <tr id="row-${stock.security_id}">
                        <td>
                            <div class="stock-name">${stock.name}</div>
                            <div class="stock-symbol">${stock.symbol}</div>
                        </td>
                        <td class="price ${changeClass}">₹${stock.ltp.toFixed(2)}</td>
                        <td class="${changeClass}">${arrow} ${Math.abs(stock.change).toFixed(2)}</td>
                        <td>
                            <span class="change-badge ${changeClass}">
                                ${stock.change_percent.toFixed(2)}%
                            </span>
                        </td>
                        <td>₹${stock.open.toFixed(2)}</td>
                        <td>₹${stock.high.toFixed(2)}</td>
                        <td>₹${stock.low.toFixed(2)}</td>
                        <td class="volume">${stock.volume.toLocaleString()}</td>
                        <td class="last-update">${formatTime(stock.timestamp)}</td>
                    </tr>
                `;
            }).join('');
        }

        function updateStats() {
            const gainers = stockData.filter(s => s.change > 0).length;
            const losers = stockData.filter(s => s.change < 0).length;

            document.getElementById('totalStocks').textContent = stockData.length;
            document.getElementById('gainers').textContent = gainers;
            document.getElementById('losers').textContent = losers;
        }

        function updateStatus(status, text) {
            const statusEl = document.getElementById('connectionStatus');
            statusEl.className = `status ${status}`;
            statusEl.querySelector('span').textContent = text;
        }

        function showError(message) {
            const errorContainer = document.getElementById('errorContainer');
            errorContainer.innerHTML = `<div class="error-message">${message}</div>`;
            errorContainer.style.display = 'block';
            document.getElementById('loadingContainer').style.display = 'none';
        }

        function formatTime(timestamp) {
            if (!timestamp) return '-';
            const date = new Date(timestamp);
            return date.toLocaleTimeString();
        }

        // Search functionality
        document.getElementById('searchBox').addEventListener('input', (e) => {
            searchTerm = e.target.value;
            renderStocks();
        });

        // Start auto-refresh on page load
        startAutoRefresh();

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            stopAutoRefresh();
        });
    </script>
</body>
</html>
